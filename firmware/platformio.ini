[platformio]
default_envs = native

[env:native]
platform = native
test_framework = unity
test_build_src = true
build_src_filter = +<*> -<main.cpp>
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CAFFEINATE_NATIVE_USB_CDC=1

; Classic ESP32 DevKit / ESP-WROOM-32 (USB-UART bridge, e.g. ELEGOO DevKit V1).
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -D CAFFEINATE_NATIVE_USB_CDC=0
